name: Temporary TRAE Ideas Data

on:
  push:
    branches:
      - tmp-trae-ideas-data-20260716
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-data:
    if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-trae-ideas-data-20260716

      - name: Download and compact public snapshot
        run: |
          mkdir -p tmp-trae-data
          curl --fail --location --retry 5 --retry-delay 3 \
            -o /tmp/demos.json \
            https://raw.githubusercontent.com/luoqianshi/TRAE-AI-Creativity-Competition-Idea-Hall/main/data/demos.json
          python - <<'PY'
          import gzip
          import html
          import json
          from pathlib import Path
          from urllib.parse import quote

          source = json.loads(Path('/tmp/demos.json').read_text(encoding='utf-8'))
          rows = source.get('demos', [])
          out = Path('tmp-trae-data/ideas.ndjson.gz')
          with gzip.open(out, 'wt', encoding='utf-8', compresslevel=9) as f:
              for item in rows:
                  demo_url = item.get('demo_url')
                  attachment_url = None
                  if demo_url:
                      attachment_url = 'https://raw.githubusercontent.com/luoqianshi/TRAE-AI-Creativity-Competition-Idea-Hall/main/' + quote(demo_url, safe='/')
                  excerpt_html = item.get('excerpt') or ''
                  record = {
                      'topic_id': item.get('topic_id'),
                      'title': item.get('title'),
                      'forum_url': item.get('forum_url'),
                      'author': item.get('author'),
                      'created_at': item.get('created_at'),
                      'tags': item.get('tags') or [],
                      'views': item.get('views'),
                      'like_count': item.get('like_count'),
                      'excerpt_html': excerpt_html,
                      'detail_text': html.unescape(excerpt_html),
                      'cover_image': item.get('cover_image'),
                      'demo_type': item.get('demo_type'),
                      'demo_url': demo_url,
                      'html_attachment_url': attachment_url,
                      'external_url': item.get('external_url'),
                      'has_demo': item.get('has_demo'),
                      'archived': item.get('archived'),
                      'insight': item.get('insight'),
                      'approved': item.get('approved'),
                      'approved_source': item.get('approved_source'),
                      'screenshot': item.get('screenshot'),
                  }
                  f.write(json.dumps(record, ensure_ascii=False, separators=(',', ':')) + '\n')

          Path('tmp-trae-data/metadata.json').write_text(
              json.dumps({
                  'last_updated': source.get('last_updated'),
                  'total_count': source.get('total_count'),
                  'exported_rows': len(rows),
                  'source': 'https://github.com/luoqianshi/TRAE-AI-Creativity-Competition-Idea-Hall/blob/main/data/demos.json'
              }, ensure_ascii=False, indent=2),
              encoding='utf-8'
          )
          print(f'exported {len(rows)} records, gzip={out.stat().st_size} bytes')
          PY

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-trae-data/ideas.ndjson.gz tmp-trae-data/metadata.json
          git commit -m "生成TRAE点子数据快照 [skip ci]"
          git push origin tmp-trae-ideas-data-20260716

  upload-artifact:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload compact data
        uses: actions/upload-artifact@v4
        with:
          name: trae-ideas-data
          path: |
            tmp-trae-data/ideas.ndjson.gz
            tmp-trae-data/metadata.json
          if-no-files-found: error
          retention-days: 1

  build-excel:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Excel writer
        run: python -m pip install --disable-pip-version-check XlsxWriter
      - name: Build complete Excel workbook
        run: |
          mkdir -p tmp-trae-excel
          python - <<'PY'
          import gzip
          import html
          import json
          import re
          from collections import Counter
          from pathlib import Path

          import xlsxwriter

          data_path = Path('tmp-trae-data/ideas.ndjson.gz')
          meta = json.loads(Path('tmp-trae-data/metadata.json').read_text(encoding='utf-8'))
          output = Path('tmp-trae-excel/TRAE_AI创造力大赛报名点子汇总_20260716.xlsx')

          tag_re = re.compile(r'<[^>]+>')
          def clean_detail(value):
              value = html.unescape(value or '')
              value = re.sub(r'<br\\s*/?>', '\\n', value, flags=re.I)
              value = re.sub(r'</p\\s*>', '\\n', value, flags=re.I)
              value = tag_re.sub('', value)
              value = value.replace('\\r\\n', '\\n').replace('\\r', '\\n')
              value = re.sub(r'\\n{3,}', '\\n\\n', value)
              return value.strip()[:32767]

          rows = []
          tag_counts = Counter()
          demo_count = approved_count = archived_count = 0
          total_views = total_likes = 0
          external_count = cover_count = 0
          with gzip.open(data_path, 'rt', encoding='utf-8') as fh:
              for line in fh:
                  item = json.loads(line)
                  rows.append(item)
                  tag_counts.update(item.get('tags') or [])
                  demo_count += bool(item.get('has_demo'))
                  approved_count += bool(item.get('approved'))
                  archived_count += bool(item.get('archived'))
                  total_views += int(item.get('views') or 0)
                  total_likes += int(item.get('like_count') or 0)
                  external_count += bool(item.get('external_url'))
                  cover_count += bool(item.get('cover_image'))

          workbook = xlsxwriter.Workbook(output, {
              'constant_memory': True,
              'strings_to_urls': False,
              'strings_to_formulas': False,
          })
          workbook.set_properties({
              'title': 'TRAE AI 创造力大赛报名点子汇总',
              'subject': '论坛报名点子全量数据',
              'author': '数据整理',
              'comments': '基于公开聚合快照生成',
          })

          navy = '#17365D'
          blue = '#1F4E78'
          light_blue = '#D9EAF7'
          pale_blue = '#EAF2F8'
          yellow = '#FFF2CC'
          border = '#D0D7DE'

          title_fmt = workbook.add_format({'bold': True, 'font_color': 'white', 'bg_color': navy, 'font_size': 20, 'align': 'center', 'valign': 'vcenter'})
          subtitle_fmt = workbook.add_format({'font_color': navy, 'bg_color': light_blue, 'italic': True, 'align': 'center', 'valign': 'vcenter'})
          header_fmt = workbook.add_format({'bold': True, 'font_color': 'white', 'bg_color': navy, 'align': 'center', 'valign': 'vcenter', 'text_wrap': True, 'border': 1, 'border_color': border})
          section_fmt = workbook.add_format({'bold': True, 'font_color': 'white', 'bg_color': blue, 'align': 'center', 'border': 1, 'border_color': border})
          kpi_title_fmt = workbook.add_format({'bold': True, 'font_color': navy, 'bg_color': pale_blue, 'align': 'center', 'valign': 'vcenter', 'border': 1, 'border_color': '#9FBAD0'})
          kpi_value_fmt = workbook.add_format({'bold': True, 'font_color': blue, 'bg_color': pale_blue, 'font_size': 18, 'align': 'center', 'valign': 'vcenter', 'border': 1, 'border_color': '#9FBAD0', 'num_format': '#,##0'})
          normal_fmt = workbook.add_format({'valign': 'top'})
          center_fmt = workbook.add_format({'align': 'center', 'valign': 'top'})
          number_fmt = workbook.add_format({'num_format': '#,##0', 'valign': 'top'})
          wrap_fmt = workbook.add_format({'text_wrap': True, 'valign': 'top'})
          link_fmt = workbook.add_format({'font_color': '#0563C1', 'underline': True, 'align': 'center', 'valign': 'top'})
          raw_url_fmt = workbook.add_format({'font_color': '#0563C1', 'valign': 'top'})
          note_fmt = workbook.add_format({'font_color': '#7F6000', 'bg_color': yellow, 'text_wrap': True, 'valign': 'vcenter', 'border': 1, 'border_color': '#E6D77A'})
          cell_border_fmt = workbook.add_format({'border': 1, 'border_color': border, 'valign': 'top'})
          cell_border_wrap_fmt = workbook.add_format({'border': 1, 'border_color': border, 'text_wrap': True, 'valign': 'top'})

          # 概览页
          ws = workbook.add_worksheet('数据概览')
          ws.hide_gridlines(2)
          ws.merge_range('A1:H2', 'TRAE AI 创造力大赛 · 报名点子数据概览', title_fmt)
          ws.set_row(0, 26)
          ws.set_row(1, 26)
          ws.merge_range('A3:H3', f"数据快照：{meta.get('last_updated', '')}｜导出记录：{len(rows):,} 条｜来源：公开论坛聚合快照", subtitle_fmt)

          kpis = [('记录总数', len(rows)), ('包含 Demo', demo_count), ('审核通过', approved_count), ('已归档', archived_count)]
          for i, (label, value) in enumerate(kpis):
              col = i * 2
              ws.write(4, col, label, kpi_title_fmt)
              ws.write(5, col, value, kpi_value_fmt)
              ws.set_column(col, col, 22)
              ws.set_column(col + 1, col + 1, 3)
          ws.set_row(4, 24)
          ws.set_row(5, 34)

          ws.write_row('A8', ['指标', '数量', '指标', '数量'], section_fmt)
          metric_rows = [
              ['累计浏览量', total_views, '累计点赞数', total_likes],
              ['有外部链接', external_count, '有封面图', cover_count],
              ['无 Demo', len(rows) - demo_count, '未审核通过', len(rows) - approved_count],
          ]
          for r, vals in enumerate(metric_rows, start=8):
              ws.write(r, 0, vals[0], cell_border_fmt)
              ws.write_number(r, 1, vals[1], cell_border_fmt)
              ws.write(r, 2, vals[2], cell_border_fmt)
              ws.write_number(r, 3, vals[3], cell_border_fmt)

          ws.write_row('A13', ['赛道 / 标签', '记录数'], section_fmt)
          top_tags = tag_counts.most_common(8)
          for r, (tag, count) in enumerate(top_tags, start=13):
              ws.write(r, 0, tag, cell_border_fmt)
              ws.write_number(r, 1, count, cell_border_fmt)

          if top_tags:
              chart = workbook.add_chart({'type': 'column'})
              chart.add_series({
                  'name': '记录数',
                  'categories': ['数据概览', 13, 0, 12 + len(top_tags), 0],
                  'values': ['数据概览', 13, 1, 12 + len(top_tags), 1],
                  'fill': {'color': '#5B9BD5'},
                  'border': {'color': '#5B9BD5'},
              })
              chart.set_title({'name': '报名点子赛道 / 标签分布'})
              chart.set_legend({'none': True})
              chart.set_y_axis({'major_gridlines': {'visible': False}, 'num_format': '#,##0'})
              chart.set_style(10)
              ws.insert_chart('D13', chart, {'x_scale': 1.1, 'y_scale': 1.05})

          ws.merge_range('A24:H27', '说明：本工作簿基于公开聚合快照生成。详情内容列保存论坛公开快照提供的帖子摘要；原帖列可打开论坛详情页。HTML附件列指向参赛者上传的 HTML Demo 文件。未将全部 HTML 二进制嵌入工作簿，以避免数 GB 级附件导致 Excel 无法正常打开。', note_fmt)
          ws.set_row(23, 24)
          ws.set_row(24, 24)
          ws.set_row(25, 24)
          ws.set_row(26, 24)
          ws.freeze_panes(3, 0)

          # 全量明细页
          detail = workbook.add_worksheet('点子明细')
          detail.hide_gridlines(2)
          detail.freeze_panes(1, 0)
          headers = [
              '序号', '话题ID', '点子标题', '赛道/标签', '作者', '发布时间（UTC）',
              '浏览量', '点赞数', '是否有Demo', 'Demo类型', '是否审核通过', '审核来源',
              '是否归档', '点子洞察/简述', '详情内容（文本）', '详情HTML（公开摘要）',
              '打开原帖', '原帖URL', '打开HTML附件', 'HTML附件URL',
              '外部Demo链接', '封面图链接', '截图路径', '数据快照时间'
          ]
          detail.write_row(0, 0, headers, header_fmt)
          detail.set_row(0, 34)
          widths = [8, 11, 42, 22, 20, 24, 11, 10, 12, 13, 14, 16, 11, 38, 72, 62, 13, 48, 16, 62, 48, 48, 38, 30]
          for col, width in enumerate(widths):
              detail.set_column(col, col, width)

          snapshot_time = meta.get('last_updated', '')
          for excel_row, item in enumerate(rows, start=1):
              tags = '、'.join(item.get('tags') or [])
              detail.write_number(excel_row, 0, excel_row, center_fmt)
              detail.write_number(excel_row, 1, int(item.get('topic_id') or 0), center_fmt)
              detail.write(excel_row, 2, item.get('title') or '', normal_fmt)
              detail.write(excel_row, 3, tags, wrap_fmt)
              detail.write(excel_row, 4, item.get('author') or '', normal_fmt)
              detail.write(excel_row, 5, item.get('created_at') or '', normal_fmt)
              detail.write_number(excel_row, 6, int(item.get('views') or 0), number_fmt)
              detail.write_number(excel_row, 7, int(item.get('like_count') or 0), number_fmt)
              detail.write(excel_row, 8, '是' if item.get('has_demo') else '否', center_fmt)
              detail.write(excel_row, 9, item.get('demo_type') or '', center_fmt)
              detail.write(excel_row, 10, '是' if item.get('approved') else '否', center_fmt)
              detail.write(excel_row, 11, item.get('approved_source') or '', center_fmt)
              detail.write(excel_row, 12, '是' if item.get('archived') else '否', center_fmt)
              detail.write(excel_row, 13, item.get('insight') or '', wrap_fmt)
              detail.write(excel_row, 14, clean_detail(item.get('detail_text') or item.get('excerpt_html') or ''), wrap_fmt)
              detail.write(excel_row, 15, (item.get('excerpt_html') or '')[:32767], wrap_fmt)

              forum_url = item.get('forum_url') or ''
              if forum_url:
                  detail.write_url(excel_row, 16, forum_url, link_fmt, '打开原帖')
              else:
                  detail.write_blank(excel_row, 16, None, center_fmt)
              detail.write_string(excel_row, 17, forum_url, raw_url_fmt)

              html_url = item.get('html_attachment_url') or ''
              if html_url:
                  detail.write_url(excel_row, 18, html_url, link_fmt, '打开HTML附件')
              else:
                  detail.write_blank(excel_row, 18, None, center_fmt)
              detail.write_string(excel_row, 19, html_url, raw_url_fmt)

              detail.write_string(excel_row, 20, item.get('external_url') or '', raw_url_fmt)
              detail.write_string(excel_row, 21, item.get('cover_image') or '', raw_url_fmt)
              detail.write(excel_row, 22, item.get('screenshot') or '', normal_fmt)
              detail.write(excel_row, 23, snapshot_time, normal_fmt)

          last_row = len(rows)
          detail.autofilter(0, 0, last_row, len(headers) - 1)
          detail.conditional_format(1, 6, last_row, 6, {'type': 'data_bar', 'bar_color': '#5B9BD5'})
          detail.conditional_format(1, 7, last_row, 7, {'type': 'data_bar', 'bar_color': '#70AD47'})
          detail.conditional_format(1, 8, last_row, 8, {'type': 'text', 'criteria': 'containing', 'value': '是', 'format': workbook.add_format({'bg_color': '#E2F0D9', 'font_color': '#375623'})})
          detail.conditional_format(1, 10, last_row, 10, {'type': 'text', 'criteria': 'containing', 'value': '否', 'format': workbook.add_format({'bg_color': '#FCE4D6', 'font_color': '#C00000'})})

          # 字段说明页
          notes = workbook.add_worksheet('字段说明')
          notes.hide_gridlines(2)
          notes.merge_range('A1:D2', '字段说明与使用指引', title_fmt)
          notes.write_row('A4', ['字段', '含义', '数据来源', '注意事项'], section_fmt)
          field_notes = [
              ['详情内容（文本）', '论坛公开摘要经 HTML 解码和文本清洗后的内容', '公开聚合快照 excerpt', '部分帖子摘要可能带省略号；完整帖子请打开原帖'],
              ['详情HTML（公开摘要）', '论坛快照中的原始摘要 HTML/转义文本', '公开聚合快照 excerpt', '不等同于完整帖子 HTML'],
              ['打开原帖', '跳转至论坛帖子详情页', 'forum_url', '需要网络访问 forum.trae.cn'],
              ['打开HTML附件', '打开参赛者上传的 HTML Demo', '聚合仓库 demos 目录', '没有上传 HTML Demo 的记录为空'],
              ['外部Demo链接', '参赛者提供的第三方演示地址', 'external_url', '第三方链接可用性可能变化'],
              ['是否审核通过', '聚合数据中标记的审核状态', 'approved', '不是官方获奖结果'],
              ['数据快照时间', '聚合数据最近更新时间', 'last_updated', '论坛后续新增内容不在本次文件中'],
          ]
          for r, values in enumerate(field_notes, start=4):
              for c, value in enumerate(values):
                  notes.write(r, c, value, cell_border_wrap_fmt)
          notes.set_column('A:A', 24)
          notes.set_column('B:B', 42)
          notes.set_column('C:C', 28)
          notes.set_column('D:D', 50)
          notes.freeze_panes(4, 0)

          workbook.close()
          print(f'generated {output} size={output.stat().st_size} rows={len(rows)}')
          PY

      - name: Upload Excel workbook
        uses: actions/upload-artifact@v4
        with:
          name: trae-ideas-excel
          path: tmp-trae-excel/TRAE_AI创造力大赛报名点子汇总_20260716.xlsx
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
